    <script>
      // Polyfill/guard to make window.fetch writable when browser extensions attempt to intercept it
      (function() {
        try {
          var originalFetch = window.fetch;
          var currentFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return currentFetch || originalFetch;
            },
            set: function(val) {
              currentFetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // fallback ignore
        }
      })();
    </script>
